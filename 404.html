<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SPELLIA AR</title>
<script>
(function () {
  var m = location.pathname.match(/(\d{1,2})\/?$/);
  if (m) {
    var n = ("0" + m[1]).slice(-2);
    var ids = ["01","02","03","04","05","06","07","08","09","10","11"];
    if (ids.indexOf(n) >= 0) {
      location.replace("https://itanene.github.io/spellia-ar/?card=" + n);
      return;
    }
  }
  location.replace("https://itanene.github.io/spellia-ar/");
})();
</script>
</head>
<body>SPELLIA AR へ移動中…</body>
</html>
